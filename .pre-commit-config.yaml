repos:
  - repo: local
    hooks:
      - id: llm-harness
        name: LLM harness (fast mode)
        # Runs the same single source of truth as the installed
        # `.git/hooks/pre-commit` shim and as CI: `scripts/run-llm-hooks.ps1`.
        # We intentionally do NOT pass `-SkipStagedCheck` or `-NoAutoFix`:
        # this config is meant for local development and must let AutoFix
        # stage regenerated files, mirroring the installed direct shim's
        # auto-recovery behavior. CI runs
        # `run-llm-hooks.ps1 -NoAutoFix` directly (see
        # `.github/workflows/llm-harness.yml`) so drift fails loudly there.
        entry: pwsh -NoProfile -File scripts/run-llm-hooks.ps1 -Mode PreCommit -AutoFix
        language: system
        pass_filenames: false
