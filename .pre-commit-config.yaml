repos:
  - repo: local
    hooks:
      - id: llm-harness
        name: LLM harness (regenerate index, lint, self-tests)
        # Single source of truth: matches `.githooks/pre-commit` and CI.
        # `-SkipStagedCheck` because the pre-commit framework manages its
        # own staging of files in a temp area.
        entry: pwsh -NoProfile -File scripts/run-llm-hooks.ps1 -SkipStagedCheck
        language: system
        pass_filenames: false
