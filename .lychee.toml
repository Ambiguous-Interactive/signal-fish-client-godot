# Signal Fish Godot Client - lychee link-checker configuration
#
# lychee is a fast, async link checker for markdown and HTML.
# Docs: https://lychee.cli.rs

# -------------------------------------------------------------
# Input / output
# -------------------------------------------------------------

# Check links in markdown files across the repository
glob_ignore_case = true

# -------------------------------------------------------------
# Directories and paths to exclude from scanning
# -------------------------------------------------------------
exclude_path = [
    "(^|/)site/",
    "^\\.git/",
    "(^|/)\\.venv/",
    "(^|/)\\.venv-ci/",
    "(^|/)node_modules/",
    "^progress/",
]

# -------------------------------------------------------------
# URL patterns to exclude from checking
# -------------------------------------------------------------
exclude = [
    # Mail links - cannot be validated
    "^mailto:",

    # New Pages routes return 404 until the merge-triggered deployment. MkDocs
    # strict navigation validates every route locally before publication.
    "^https://[Aa]mbiguous-[Ii]nteractive\\.github\\.io/signal-fish-client-godot/",

    # Badge image URLs - shields.io can be flaky
    "^https://img\\.shields\\.io/",

    # GitHub Actions status badges - may 404 before repo is public
    "^https://github\\.com/[Aa]mbiguous-?[Ii]nteractive/signal-fish-client.*/actions",

    # Anchor-only links (intra-page) - mkdocs generates these
    "^#",
]

# -------------------------------------------------------------
# HTTP behavior - tune for CI reliability
# -------------------------------------------------------------

# Accept all 2xx success codes and HTTP 429 (Too Many Requests) as valid:
# the link exists, the server is just rate-limiting us.
# NOTE: Use range syntax "200..=299", not the shorthand "2xx" which is
# only supported on the CLI, not in TOML config files.
accept = ["200..=299", "429"]

# Number of retries before marking a link as broken
max_retries = 3

# Timeout per request (seconds)
timeout = 30

# Delay between retries (seconds)
retry_wait_time = 5

# Maximum number of concurrent requests (be polite to external servers)
max_concurrency = 8

# Follow redirects (e.g. http -> https upgrades)
max_redirects = 10

# -------------------------------------------------------------
# Misc
# -------------------------------------------------------------

# Do not require HTTPS - some legitimate links use HTTP
require_https = false

# Exclude loopback and private IP addresses - never reachable in CI
exclude_loopback = true
exclude_private = true

# User agent - some servers block requests without one
# NOTE: lychee v0.23+ requires headers as a TOML inline table { key = "value" }.
header = { user-agent = "lychee (signal-fish-client-godot CI)" }
