[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
; All-resources export: "selected scenes" does not chase preload() chains in
; scripts, so addon scripts were missing from the pack and the page failed to
; boot. Dev trees are excluded to keep the pack small.
export_filter="all_resources"
export_files=PackedStringArray("res://demo/main.tscn")
exclude_filter="tests/*,docs/*,scripts/*,progress/*,site/*,hooks/*,overrides/*,.llm/*,.github/*,.devcontainer/*,.claude/*,.githooks/*,build/*,node_modules/*"
include_filter=""
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
