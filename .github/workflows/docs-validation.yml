name: Docs Validation

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:
        inputs:
            expected_sha:
                description: Commit expected on main
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify-dispatch:
        name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Check dispatched commit
              env:
                  EXPECTED_SHA: ${{ inputs.expected_sha }}
              run: python3 scripts/workflow-gates.py verify-sha

    markdownlint:
        name: Markdownlint
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Docs style (ASCII, no LLM-isms)
              run: python3 scripts/check-docs-style.py

            - name: Workflow helper tests
              run: |
                  python3 tests/test_docs_deploy_wait.py
                  python3 tests/test_dependabot_auto_merge.py
                  python3 tests/test_check_link_report.py
                  python3 -m unittest tests.test_workflow_gates

            - name: Run markdownlint
              uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
              with:
                  globs: |
                      **/*.md

    link-check:
        name: Link Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            # fail: false - the policy step below decides. lychee cannot
            # scope accepted codes per URL; the policy tolerates a 5xx from
            # github.com (issue #352) and stays strict on everything else.
            - name: Run lychee link checker
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
              with:
                  args: >-
                      --config .lychee.toml
                      "**/*.md"
                      "llms.txt"
                  fail: false
                  format: json
                  output: lychee/out.json

            - name: Apply link-check policy
              run: python3 scripts/check-link-report.py lychee/out.json

    accessibility:
        name: Rendering + Accessibility
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python
              id: setup-python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            # The venv is rebuilt only when the pinned docs tooling or the
            # resolved Python version changes; otherwise restore and run
            # directly (same pattern as ci.yml and llm-harness.yml, #111).
            - name: Cache docs venv
              id: docs-venv-cache
              uses: actions/cache@v6
              with:
                  path: .venv-docs
                  key: venv-docs-uv-v2-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('scripts/install-ci-venv.py', 'requirements-docs.txt', 'requirements-docs-accessibility.txt') }}

            - name: Install MkDocs dependencies with uv
              if: steps.docs-venv-cache.outputs.cache-hit != 'true'
              env:
                  PIP_DEFAULT_TIMEOUT: "60"
                  UV_HTTP_TIMEOUT: "60"
                  UV_HTTP_RETRIES: "5"
              run: python3 scripts/install-ci-venv.py .venv-docs requirements-docs.txt requirements-docs-accessibility.txt

            - name: Test documentation output checks
              run: python3 -m unittest tests.test_docs_build

            - name: Build MkDocs site strictly
              run: .venv-docs/bin/python -m mkdocs build --strict

            # Issue #123: this build is the one artifact Docs Deploy publishes;
            # main pushes hand it off instead of building a third time there.
            - name: Upload site for deploy
              if: github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: docs-site
                  path: site/
                  retention-days: 1

            # Shared, cached Playwright + Chromium setup (issue #137). The
            # composite action owns the version pin, so the two consumer
            # workflows cannot drift.
            - name: Set up Playwright Chromium
              uses: ./.github/actions/playwright-chromium
              with:
                  python-path: .venv-docs/bin/python

            - name: Test accessibility cleanup
              run: .venv-docs/bin/python -m unittest discover -s tests -p test_docs_accessibility_cleanup.py

            - name: Test responsive documentation accessibility
              env:
                  DEBUG: pw:browser
              run: .venv-docs/bin/python scripts/check-docs-accessibility.py

    required:
        name: Docs Validation Required
        if: ${{ always() }}
        needs: [verify-dispatch, markdownlint, link-check, accessibility]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Require every docs validation job
              env:
                  NEEDS_JSON: ${{ toJSON(needs) }}
              run: >-
                  python3 scripts/workflow-gates.py require-jobs
                  verify-dispatch markdownlint link-check accessibility
                  --allow-skipped verify-dispatch
