name: Docs Validation

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    PLAYWRIGHT_VERSION: "1.61.1"

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    markdownlint:
        name: Markdownlint
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Docs style (ASCII, no LLM-isms)
              run: python3 scripts/check-docs-style.py

            - name: Run markdownlint
              uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
              with:
                  globs: |
                      **/*.md

    link-check:
        name: Link Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Run lychee link checker
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
              with:
                  args: >-
                      --config .lychee.toml
                      "**/*.md"
                      "llms.txt"
                  fail: true

    accessibility:
        name: Rendering + Accessibility
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python
              id: setup-python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            # The venv is rebuilt only when the pinned docs tooling or the
            # resolved Python version changes; otherwise restore and run
            # directly (same pattern as ci.yml and llm-harness.yml, #111).
            - name: Cache docs venv
              id: docs-venv-cache
              uses: actions/cache@v6
              with:
                  path: .venv-docs
                  key: venv-docs-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements-docs.txt') }}

            - name: Install MkDocs dependencies
              if: steps.docs-venv-cache.outputs.cache-hit != 'true'
              run: |
                  python3 -m venv .venv-docs
                  . .venv-docs/bin/activate
                  python -m pip install -r requirements-docs.txt

            - name: Build MkDocs site strictly
              run: |
                  . .venv-docs/bin/activate
                  mkdocs build --strict
                  test -f site/llms.txt

            - name: Verify every nav page rendered
              run: |
                  status=0
                  for page in index getting-started client events errors \
                      game-data reconnection web-export testing mesh-guide \
                      releasing attributions; do
                      if [ "${page}" = "index" ]; then
                          rendered="site/index.html"
                      else
                          rendered="site/${page}/index.html"
                      fi
                      if [ ! -f "${rendered}" ]; then
                          printf '::error::missing rendered page: %s\n' "${page}"
                          status=1
                      fi
                  done
                  exit "${status}"

            # Issue #123: this build is the one artifact Docs Deploy publishes;
            # main pushes hand it off instead of building a third time there.
            - name: Upload site for deploy
              if: github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: docs-site
                  path: site/
                  retention-days: 1

            - name: Record runner image version
              run: echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

            - name: Cache Playwright Chromium
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/ms-playwright
                      node_modules
                  # v3: the entry now also carries the system-deps stamp, and
                  # the key includes the runner image version so an image
                  # refresh cannot pair a stale stamp with changed libraries.
                  key: playwright-chromium-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.IMAGE_VERSION }}-${{ env.PLAYWRIGHT_VERSION }}

            - name: Install pinned Playwright package
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"

            - name: Install pinned Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install chromium

            # System libraries are needed on every fresh runner even when the
            # browser cache hits, but apt-get update (which Playwright's
            # installer runs internally, and where the runner image's
            # third-party Google Chrome repo can be mid-publish) is the
            # slowest step of this job. A stamp file inside the cached
            # browser directory records a completed install for this runner
            # image + Playwright pair (the cache key also carries both), so
            # warm runs skip the ~9 s npx probe and the apt cycle entirely.
            # On any miss, ask Playwright for its own package list and skip
            # apt entirely when dpkg already satisfies it; any parse
            # surprise falls back to the original install path.
            - name: Install Chromium system dependencies
              run: |
                  stamp="${HOME}/.cache/ms-playwright/.sf-system-deps"
                  mkdir -p "$(dirname "$stamp")"
                  # Without a real image version (self-hosted runners) the
                  # stamp could pin stale state across image updates, so it
                  # is neither trusted nor written there.
                  if [ "${IMAGE_VERSION}" != "unknown" ] && [ -f "$stamp" ] \
                      && [ "$(cat "$stamp")" = "${IMAGE_VERSION} ${PLAYWRIGHT_VERSION}" ]; then
                      echo "chromium system dependencies already installed (stamp)"
                      exit 0
                  fi
                  pkgs=$(npx playwright install-deps --dry-run chromium 2>/dev/null \
                      | tr ' \\\t' '\n\n\n' \
                      | grep -E '^[a-z0-9][a-z0-9+.~-]*$' \
                      | grep -vE '^(sudo|apt|apt-get|install|update|cd)$' \
                      | sort -u) || true
                  missing=1
                  if [ -n "$pkgs" ]; then
                      missing=0
                      for pkg in $pkgs; do
                          # Exact status (not `dpkg -s`, which succeeds for
                          # removed-but-rc packages whose files are gone).
                          # The `|| status=` guard matters: GitHub runs this
                          # as `bash -e`, and dpkg-query exits 1 for any
                          # package absent from the dpkg database, the
                          # normal case on a fresh runner — which must fall
                          # through to the install path, not abort the step.
                          status=$(dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null) || status=""
                          if [ "$status" != "installed" ]; then
                              missing=1
                              break
                          fi
                      done
                  fi
                  if [ "$missing" -eq 0 ]; then
                      echo "chromium system dependencies already present"
                      if [ "${IMAGE_VERSION}" != "unknown" ]; then
                          printf '%s %s\n' "${IMAGE_VERSION}" "${PLAYWRIGHT_VERSION}" > "$stamp"
                      fi
                      exit 0
                  fi
                  sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
                  for attempt in 1 2 3; do
                      if npx playwright install-deps chromium; then
                          if [ "${IMAGE_VERSION}" != "unknown" ]; then
                              printf '%s %s\n' "${IMAGE_VERSION}" "${PLAYWRIGHT_VERSION}" > "$stamp"
                          fi
                          break
                      fi
                      if [ "${attempt}" -eq 3 ]; then
                          printf 'playwright install-deps failed after %d attempts\n' "${attempt}" >&2
                          exit 1
                      fi
                      printf 'playwright install-deps attempt %d failed; retrying\n' "${attempt}" >&2
                      sleep 20
                  done

            - name: Test responsive documentation accessibility
              run: node scripts/check-docs-accessibility.cjs

    required:
        name: Docs Validation Required
        if: ${{ always() }}
        needs: [markdownlint, link-check, accessibility]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Require every docs validation job
              env:
                  NEEDS_JSON: ${{ toJSON(needs) }}
              run: |
                  failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS_JSON")
                  if [ -n "$failures" ]; then
                      printf '::error::Required jobs did not succeed:\n%s\n' "$failures"
                      exit 1
                  fi
