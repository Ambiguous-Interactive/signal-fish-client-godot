name: Docs Validation

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    PLAYWRIGHT_VERSION: "1.61.1"

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    markdownlint:
        name: Markdownlint
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Run markdownlint
              uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
              with:
                  globs: |
                      **/*.md

    link-check:
        name: Link Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Run lychee link checker
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
              with:
                  args: >-
                      --config .lychee.toml
                      "**/*.md"
                      "llms.txt"
                  fail: true

    rendering-check:
        name: Rendering Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements-docs.txt

            - name: Install MkDocs dependencies
              run: pip install -r requirements-docs.txt

            - name: Build MkDocs site strictly
              run: mkdocs build --strict

            - name: Verify every nav page rendered
              run: |
                  status=0
                  for page in index getting-started client events errors \
                      game-data reconnection web-export testing mesh-guide \
                      releasing attributions; do
                      if [ "${page}" = "index" ]; then
                          rendered="site/index.html"
                      else
                          rendered="site/${page}/index.html"
                      fi
                      if [ ! -f "${rendered}" ]; then
                          printf '::error::missing rendered page: %s\n' "${page}"
                          status=1
                      fi
                  done
                  exit "${status}"

    accessibility:
        name: Accessibility
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements-docs.txt

            - name: Install MkDocs dependencies
              run: pip install -r requirements-docs.txt

            - name: Build MkDocs site strictly
              run: mkdocs build --strict

            - name: Cache Playwright Chromium
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}

            - name: Install pinned Chromium automation
              run: |
                  npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
                  # `--with-deps` runs `apt-get update` internally, and the runner
                  # image's third-party Google Chrome repo can be mid-publish.
                  # The automation deps come only from Ubuntu's own repos, so
                  # drop the irrelevant source first; the retry covers any
                  # other third-party repo race.
                  sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
                  for attempt in 1 2 3; do
                      if npx playwright install --with-deps chromium; then
                          break
                      fi
                      if [ "${attempt}" -eq 3 ]; then
                          printf 'playwright install failed after %d attempts\n' "${attempt}" >&2
                          exit 1
                      fi
                      printf 'playwright install attempt %d failed; retrying\n' "${attempt}" >&2
                      sleep 20
                  done

            - name: Test responsive documentation accessibility
              run: node scripts/check-docs-accessibility.cjs

    required:
        name: Docs Validation Required
        if: ${{ always() }}
        needs: [markdownlint, link-check, rendering-check, accessibility]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Require every docs validation job
              env:
                  NEEDS_JSON: ${{ toJSON(needs) }}
              run: |
                  failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS_JSON")
                  if [ -n "$failures" ]; then
                      printf '::error::Required jobs did not succeed:\n%s\n' "$failures"
                      exit 1
                  fi
