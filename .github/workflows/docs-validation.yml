name: Docs Validation

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    markdownlint:
        name: Markdownlint
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Run markdownlint
              uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
              with:
                  globs: |
                      **/*.md

    link-check:
        name: Link Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Run lychee link checker
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
              with:
                  args: >-
                      --config .lychee.toml
                      "**/*.md"
                      "llms.txt"
                  fail: true

    rendering-check:
        name: Rendering Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements-docs.txt

            - name: Install MkDocs dependencies
              run: pip install -r requirements-docs.txt

            - name: Build MkDocs site strictly
              run: mkdocs build --strict

            - name: Verify every nav page rendered
              run: |
                  status=0
                  for page in index getting-started client events errors \
                      game-data reconnection web-export testing mesh-guide \
                      attributions; do
                      if [ "${page}" = "index" ]; then
                          rendered="site/index.html"
                      else
                          rendered="site/${page}/index.html"
                      fi
                      if [ ! -f "${rendered}" ]; then
                          printf '::error::missing rendered page: %s\n' "${page}"
                          status=1
                      fi
                  done
                  exit "${status}"

    required:
        name: Docs Validation Required
        if: ${{ always() }}
        needs: [markdownlint, link-check, rendering-check]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Require every docs validation job
              env:
                  NEEDS_JSON: ${{ toJSON(needs) }}
              run: |
                  failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS_JSON")
                  if [ -n "$failures" ]; then
                      printf '::error::Required jobs did not succeed:\n%s\n' "$failures"
                      exit 1
                  fi
