name: Dependabot Auto Merge

on:
    workflow_run:
        workflows:
            - Runtime CI
            - LLM Harness
        types:
            - completed

permissions:
    contents: read

concurrency:
    group: dependabot-auto-merge-${{ github.event.workflow_run.head_sha }}
    cancel-in-progress: false

jobs:
    merge:
        name: Merge after CI passes
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            actions: read
            checks: read
            contents: write
            pull-requests: write
        env:
            GH_TOKEN: ${{ github.token }}
            HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
            HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
            REQUIRED_WORKFLOWS: Runtime CI|LLM Harness
        steps:
            - name: Merge Dependabot PR after required checks pass
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ -z "${HEAD_SHA}" || -z "${HEAD_BRANCH}" ]]; then
                    echo "Missing workflow_run head metadata; skipping."
                    exit 0
                  fi

                  pull_numbers="$(
                    gh api \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
                      --jq ".[] | select(.state == \"open\" and .user.login == \"dependabot[bot]\" and .base.ref == \"main\" and .head.repo.full_name == \"${GITHUB_REPOSITORY}\" and .head.sha == \"${HEAD_SHA}\") | .number"
                  )"

                  if [[ -z "${pull_numbers}" ]]; then
                    echo "No open Dependabot PR found for ${HEAD_SHA}; skipping."
                    exit 0
                  fi

                  pull_count="$(printf '%s\n' "${pull_numbers}" | sed '/^$/d' | wc -l | tr -d ' ')"
                  if [[ "${pull_count}" != "1" ]]; then
                    echo "Expected exactly one Dependabot PR for ${HEAD_SHA}, found ${pull_count}:"
                    printf '%s\n' "${pull_numbers}"
                    exit 1
                  fi

                  pull_number="$(printf '%s\n' "${pull_numbers}" | sed '/^$/d' | head -n 1)"
                  pr_info="$(gh pr view "${pull_number}" --json baseRefName,headRefOid,isDraft,state --jq '[.state, .baseRefName, (.isDraft | tostring), .headRefOid] | @tsv')"
                  IFS=$'\t' read -r pr_state base_ref is_draft head_ref_oid <<<"${pr_info}"

                  if [[ "${pr_state}" != "OPEN" || "${base_ref}" != "main" || "${is_draft}" != "false" ]]; then
                    echo "PR #${pull_number} is not an open, ready Dependabot PR targeting main; skipping."
                    exit 0
                  fi

                  if [[ "${head_ref_oid}" != "${HEAD_SHA}" ]]; then
                    echo "PR #${pull_number} moved from ${HEAD_SHA} to ${head_ref_oid}; skipping stale workflow_run."
                    exit 0
                  fi

                  IFS='|' read -ra required_workflows <<<"${REQUIRED_WORKFLOWS}"
                  for workflow in "${required_workflows[@]}"; do
                    run_status="$(
                      gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
                        --jq "[.[].workflow_runs[] | select(.name == \"${workflow}\" and .head_sha == \"${HEAD_SHA}\")] | sort_by(.created_at) | reverse | .[0].status // \"missing\""
                    )"
                    run_conclusion="$(
                      gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
                        --jq "[.[].workflow_runs[] | select(.name == \"${workflow}\" and .head_sha == \"${HEAD_SHA}\")] | sort_by(.created_at) | reverse | .[0].conclusion // \"\""
                    )"

                    if [[ "${run_status}" != "completed" ]]; then
                      echo "${workflow} is ${run_status}; waiting for another workflow_run event."
                      exit 0
                    fi

                    if [[ "${run_conclusion}" != "success" ]]; then
                      echo "${workflow} concluded ${run_conclusion}; not merging."
                      exit 0
                    fi
                  done

                  set +e
                  non_passing_checks="$(
                    gh pr checks "${pull_number}" \
                      --json bucket,name,state,workflow \
                      --jq '.[] | select(.bucket != "pass" and .bucket != "skipping") | [.workflow, .name, .state] | @tsv'
                  )"
                  checks_exit=$?
                  set -e

                  if [[ ${checks_exit} -eq 8 ]]; then
                    echo "PR #${pull_number} still has pending checks; waiting for another workflow_run event."
                    exit 0
                  fi

                  if [[ ${checks_exit} -ne 0 ]]; then
                    echo "Unable to read PR checks for #${pull_number}; gh exited ${checks_exit}."
                    exit "${checks_exit}"
                  fi

                  if [[ -n "${non_passing_checks}" ]]; then
                    echo "PR #${pull_number} has non-passing checks; not merging:"
                    printf '%s\n' "${non_passing_checks}"
                    exit 0
                  fi

                  gh pr merge "${pull_number}" \
                    --squash \
                    --delete-branch \
                    --match-head-commit "${HEAD_SHA}"
