name: Dependabot Auto Merge

on:
    workflow_run:
        workflows:
            - Runtime CI
            - LLM Harness
            - Docs Validation
            - Dev Container
        types:
            - completed

permissions:
    contents: read

# A single group serializes merge jobs. Two Dependabot PRs finishing CI at
# the same time would otherwise merge and dispatch post-merge checks
# concurrently, interleaving the SHA gate and the dispatch calls (issue #234).
concurrency:
    group: dependabot-auto-merge
    cancel-in-progress: false

jobs:
    merge:
        name: Merge after CI passes
        if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        permissions:
            actions: write
            checks: read
            contents: write
            pull-requests: write
        env:
            GH_TOKEN: ${{ github.token }}
            HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
            REQUIRED_WORKFLOWS: Runtime CI|LLM Harness|Docs Validation
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Merge Dependabot PR after required checks pass
              shell: bash
              run: python3 scripts/dependabot-auto-merge.py
