name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Tag to release, vMAJOR.MINOR.PATCH (e.g. v0.1.0)
                required: true

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Tag, package, publish
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Validate version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$VERSION" == *$'\n'* ]]; then
                      echo "::error::version must be a single vMAJOR.MINOR.PATCH token (e.g. v0.1.0)"
                      exit 1
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"

            - name: Cut release notes from CHANGELOG
              run: |
                  header="## [$VERSION]"
                  awk -v header="$header" \
                      'index($0, header) == 1 {flag = 1; next} /^## /{flag = 0} flag' \
                      CHANGELOG.md > release-notes.md
                  if [ ! -s release-notes.md ]; then
                      echo "::error::no CHANGELOG.md section starting with [$header]; cut the changelog first"
                      exit 1
                  fi
                  cat release-notes.md

            - name: Check addon packaging contract
              run: |
                  cfg="addons/signal_fish/plugin.cfg"
                  if [ ! -f "$cfg" ]; then
                      echo "::error::$cfg is missing; the Asset Library requires it (PLAN P6)"
                      exit 1
                  fi
                  expected="${VERSION#v}"
                  actual=$(grep -oP '^\s*version\s*=\s*\K.+' "$cfg" | tr -d '"' | tr -d "'")
                  if [ "$actual" != "$expected" ]; then
                      echo "::error::$cfg version '$actual' != release $expected"
                      exit 1
                  fi

            - name: Guard against an existing tag
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set +e
                  git ls-remote --exit-code --tags origin "refs/tags/$VERSION" 2>/dev/null
                  status=$?
                  set -e
                  if [ "$status" -eq 0 ]; then
                      echo "::error::tag $VERSION already exists; pick the next version"
                      exit 1
                  elif [ "$status" -ne 2 ]; then
                      echo "::error::could not query tags (git ls-remote exit $status)"
                      exit 1
                  fi

            - name: Package addon
              run: zip -r "signal-fish-godot-${VERSION}.zip" addons

            - name: Create tag and release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$VERSION" \
                      --repo "$GITHUB_REPOSITORY" \
                      --target "$GITHUB_SHA" \
                      --title "$VERSION" \
                      --notes-file release-notes.md \
                      "signal-fish-godot-${VERSION}.zip"

    publish-asset-store:
        name: Submit Asset Library edit
        needs: release
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Gate on Asset Library credentials
              id: gate
              env:
                  ASSET_USERNAME: ${{ secrets.GODOT_ASSET_LIBRARY_USERNAME }}
                  ASSET_PASSWORD: ${{ secrets.GODOT_ASSET_LIBRARY_PASSWORD }}
                  ASSET_ID: ${{ vars.GODOT_ASSET_LIBRARY_ASSET_ID }}
                  VERSION: ${{ inputs.version }}
              run: |
                  if [ -z "$ASSET_USERNAME" ] || [ -z "$ASSET_PASSWORD" ] || [ -z "$ASSET_ID" ]; then
                      echo "Asset Library credentials not configured; skipping the store submission (see .llm/skills/asset-library-release.md)."
                      echo "available=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::version must be a single vMAJOR.MINOR.PATCH token (e.g. v0.1.0)"
                      exit 1
                  fi
                  echo "available=true" >> "$GITHUB_OUTPUT"
                  echo "RELEASE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
                  echo "RELEASE_TAG=$VERSION" >> "$GITHUB_ENV"

            - name: Submit Asset Library edit
              if: steps.gate.outputs.available == 'true'
              uses: deep-entertainment/godot-asset-lib-action@056fa4060f062a8b209a5a6744a2726ad48d6bb0 # v0.6.0
              with:
                  username: ${{ secrets.GODOT_ASSET_LIBRARY_USERNAME }}
                  password: ${{ secrets.GODOT_ASSET_LIBRARY_PASSWORD }}
                  assetId: ${{ vars.GODOT_ASSET_LIBRARY_ASSET_ID }}
                  assetTemplate: .asset-template.json.hb
