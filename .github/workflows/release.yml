name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: Tag to release, vMAJOR.MINOR.PATCH (e.g. v0.1.0)
                required: true

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Tag, package, publish
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Verify tag commit is on main
              if: github.event_name == 'push'
              run: python3 scripts/release_workflow.py check-main

            - name: Check Asset Library download
              run: python3 scripts/check-asset-archive.py --repo-root .

            - name: Prepare release
              env:
                  RELEASE_TAG: ${{ inputs.version || github.ref_name }}
              run: python3 scripts/prepare-release.py --version "$RELEASE_TAG" --github-env "$GITHUB_ENV"

            - name: Guard against an existing tag
              if: github.event_name == 'workflow_dispatch'
              run: python3 scripts/release_workflow.py check-new-tag

            - name: Create tag and release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: python3 scripts/release_workflow.py publish

    publish-asset-store:
        name: Submit Asset Library edit
        needs: release
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Gate on Asset Library credentials
              id: gate
              env:
                  ASSET_USERNAME: ${{ secrets.GODOT_ASSET_LIBRARY_USERNAME }}
                  ASSET_PASSWORD: ${{ secrets.GODOT_ASSET_LIBRARY_PASSWORD }}
                  ASSET_ID: ${{ vars.GODOT_ASSET_LIBRARY_ASSET_ID }}
                  VERSION: ${{ inputs.version || github.ref_name }}
              run: python3 scripts/release_workflow.py asset-gate

            - name: Submit Asset Library edit
              if: steps.gate.outputs.available == 'true'
              uses: deep-entertainment/godot-asset-lib-action@056fa4060f062a8b209a5a6744a2726ad48d6bb0 # v0.6.0
              with:
                  username: ${{ secrets.GODOT_ASSET_LIBRARY_USERNAME }}
                  password: ${{ secrets.GODOT_ASSET_LIBRARY_PASSWORD }}
                  assetId: ${{ vars.GODOT_ASSET_LIBRARY_ASSET_ID }}
                  assetTemplate: .asset-template.json.hb
