name: LLM Harness

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    validate:
        name: Validate LLM context
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Run LLM harness (regenerate, lint, self-tests)
              # Single source of truth shared with `.githooks/pre-commit`.
              # `-SkipStagedCheck` because CI has no git index to stage against.
              shell: pwsh
              run: pwsh -NoProfile -File scripts/run-llm-hooks.ps1 -SkipStagedCheck -NoAutoFix -VerboseOutput

            - name: Verify generated files are committed
              # CI must additionally catch the case where a contributor forgot to
              # commit regenerated files. `git diff` after the harness ran will
              # show any drift introduced by regeneration.
              shell: pwsh
              run: |
                  git diff --exit-code -- .llm/index.md .llm/context.md
                  if ($LASTEXITCODE -ne 0) {
                    Write-Host '::error::Generated .llm files differ from committed versions. Run scripts/run-llm-hooks.ps1 and commit the result.'
                    exit 1
                  }
