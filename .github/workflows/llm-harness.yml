name: LLM Harness

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            expected_sha:
                description: Commit expected on main
                required: false
                type: string

permissions:
    contents: read

# Superseded PR runs are canceled so pushed-through commits do not queue
# redundant runs; runs on main are never canceled (merge checks depend on
# them). Same policy as ci.yml.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify-dispatch:
        name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check dispatched commit
              env:
                  EXPECTED_SHA: ${{ inputs.expected_sha }}
              run: test "$GITHUB_SHA" = "$EXPECTED_SHA"

    validate:
        name: Validate LLM context
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python
              id: setup-python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"

            # The venv is rebuilt only when the pinned tooling or the resolved
            # Python version changes; otherwise restore and run directly
            # (same pattern as the ci.yml static job, issue #111).
            - name: Cache automation venv
              id: venv-cache
              uses: actions/cache@v6
              with:
                  path: .venv-ci
                  key: venv-automation-uv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements-automation.txt') }}

            - name: Install automation validation dependencies
              if: steps.venv-cache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  python3 -m pip install uv
                  python3 -m uv venv .venv-ci
                  python3 -m uv pip install --python .venv-ci/bin/python -r requirements-automation.txt

            - name: Preflight (parse-check toolkit sources)
              # MUST run before the main harness step. If any toolkit script
              # (lint-llm.ps1, install-git-hooks.ps1, etc.) is corrupted,
              # `run-llm-hooks.ps1` may not even be parseable. `-NoAutoFix`
              # keeps CI loud: a corrupted commit fails here rather than
              # being silently recovered.
              shell: pwsh
              run: pwsh -NoProfile -File scripts/preflight.ps1 -NoAutoFix -VerboseOutput

            - name: Run LLM harness (regenerate, lint)
              # Single source of truth shared with `.githooks/pre-commit`.
              # `-SkipStagedCheck` because CI validates committed content with
              # `git diff` below instead of participating in a local staging
              # flow. `-SkipSelfTests` hands the behavioral self-tests to the
              # dedicated self-test jobs (issues #84, #145) so the jobs' wall
              # clock is max(jobs) instead of the sum; coverage is unchanged.
              shell: pwsh
              run: pwsh -NoProfile -File scripts/run-llm-hooks.ps1 -Mode CI -SkipStagedCheck -NoAutoFix -VerboseOutput -PreflightAlreadyDone -SkipSelfTests

            - name: Fast hook performance guard
              shell: pwsh
              run: |
                  $runs = @()
                  for ($i = 0; $i -lt 3; $i++) {
                    $elapsed = Measure-Command {
                      pwsh -NoProfile -File scripts/run-llm-hooks.ps1 -Mode AgentFast -SkipStagedCheck -NoAutoFix | Out-Host
                    }
                    $runs += [int]$elapsed.TotalMilliseconds
                  }
                  $median = ($runs | Sort-Object)[1]
                  Write-Host "Fast hook runtimes (ms): $($runs -join ', '); median=$median"
                  if ($median -gt 5000) {
                    Write-Host "::error::Fast hook median runtime $median ms exceeds 5000 ms budget."
                    exit 1
                  }

    # The behavioral passes each get a dedicated runner (issue #145): they
    # fork child pwsh/git/python per test case, which saturates a 4-vCPU
    # runner, so in-job concurrency could not compress the wall. One pass
    # per runner makes the concurrency real and keeps behavioral growth off
    # the critical path while a behavioral pass stays under the core-job
    # wall. The union of the shards is exactly the full suite; coverage is
    # unchanged.
    self-tests-core:
        name: LLM harness self-tests (core)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Preflight and core self-tests
              # Same loud corruption gate as the validate job (issue #84
              # parallelism pattern): -NoAutoFix only parses tracked
              # sources, and the suite's destructive tests operate on temp
              # copies, so preflight and the core shard run concurrently
              # and the job wall clock is max(steps) instead of their sum.
              # The core shard is the in-process suite half
              # (-SkipBehavioralTests, issue #132). Output is buffered
              # until both processes finish so the logs do not interleave.
              shell: bash
              run: |
                  preflight_rc=0
                  pwsh -NoProfile -File scripts/preflight.ps1 -NoAutoFix -VerboseOutput >preflight.log 2>&1 &
                  preflight_pid=$!
                  core_rc=0
                  pwsh -NoProfile -File scripts/test-llm-harness.ps1 -SkipBehavioralTests -VerboseOutput >self-tests-core.log 2>&1 &
                  core_pid=$!
                  wait "$preflight_pid" || preflight_rc=$?
                  wait "$core_pid" || core_rc=$?
                  for log in preflight.log self-tests-core.log; do
                      printf '=== %s ===\n' "$log"
                      cat "$log" || true
                      rm -f "$log"
                  done
                  if [ "$preflight_rc" -ne 0 ] || [ "$core_rc" -ne 0 ]; then
                      printf '::error::core self-tests job failed (preflight=%s core=%s)\n' "$preflight_rc" "$core_rc"
                      exit 1
                  fi

    self-tests-behavioral-1:
        name: LLM harness self-tests (behavioral 1/2)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Behavioral self-tests (pass 1 of 2)
              shell: pwsh
              run: pwsh -NoProfile -File scripts/test-llm-harness.ps1 -OnlyBehavioralTests -BehavioralSubshard 1 -BehavioralSubshardCount 2 -VerboseOutput

    self-tests-behavioral-2:
        name: LLM harness self-tests (behavioral 2/2)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Behavioral self-tests (pass 2 of 2)
              shell: pwsh
              run: pwsh -NoProfile -File scripts/test-llm-harness.ps1 -OnlyBehavioralTests -BehavioralSubshard 2 -BehavioralSubshardCount 2 -VerboseOutput
