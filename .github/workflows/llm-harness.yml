name: LLM Harness

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

# Superseded PR runs are canceled so pushed-through commits do not queue
# redundant runs; runs on main are never canceled (merge checks depend on
# them). Same policy as ci.yml.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    validate:
        name: Validate LLM context
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              id: setup-python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"
                  cache: pip
                  cache-dependency-path: requirements-automation.txt

            # The venv is rebuilt only when the pinned tooling or the resolved
            # Python version changes; otherwise restore and run directly
            # (same pattern as the ci.yml static job, issue #111).
            - name: Cache automation venv
              id: venv-cache
              uses: actions/cache@v6
              with:
                  path: .venv-ci
                  key: venv-automation-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements-automation.txt') }}

            - name: Install automation validation dependencies
              if: steps.venv-cache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  python3 -m venv .venv-ci
                  . .venv-ci/bin/activate
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements-automation.txt

            - name: Preflight (parse-check toolkit sources)
              # MUST run before the main harness step. If any toolkit script
              # (lint-llm.ps1, install-git-hooks.ps1, etc.) is corrupted,
              # `run-llm-hooks.ps1` may not even be parseable. `-NoAutoFix`
              # keeps CI loud: a corrupted commit fails here rather than
              # being silently recovered.
              shell: pwsh
              run: pwsh -NoProfile -File scripts/preflight.ps1 -NoAutoFix -VerboseOutput

            - name: Run LLM harness (regenerate, lint)
              # Single source of truth shared with `.githooks/pre-commit`.
              # `-SkipStagedCheck` because CI validates committed content with
              # `git diff` below instead of participating in a local staging
              # flow. `-SkipSelfTests` hands the behavioral self-tests to the
              # parallel `self-tests` job so job wall clock is max(jobs)
              # instead of the sum (issue #84); coverage is unchanged.
              shell: pwsh
              run: pwsh -NoProfile -File scripts/run-llm-hooks.ps1 -Mode CI -SkipStagedCheck -NoAutoFix -VerboseOutput -PreflightAlreadyDone -SkipSelfTests

            - name: Fast hook performance guard
              shell: pwsh
              run: |
                  $runs = @()
                  for ($i = 0; $i -lt 3; $i++) {
                    $elapsed = Measure-Command {
                      pwsh -NoProfile -File scripts/run-llm-hooks.ps1 -Mode AgentFast -SkipStagedCheck -NoAutoFix | Out-Host
                    }
                    $runs += [int]$elapsed.TotalMilliseconds
                  }
                  $median = ($runs | Sort-Object)[1]
                  Write-Host "Fast hook runtimes (ms): $($runs -join ', '); median=$median"
                  if ($median -gt 5000) {
                    Write-Host "::error::Fast hook median runtime $median ms exceeds 5000 ms budget."
                    exit 1
                  }

    self-tests:
        name: LLM harness self-tests
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Preflight and sharded self-tests
              # Same loud corruption gate as the validate job (issue #84
              # parallelism pattern): -NoAutoFix only parses tracked
              # sources, and the suite's destructive tests operate on temp
              # copies, so preflight, the core shard, and the two
              # round-robin behavioral passes run concurrently and the job
              # wall clock is max(steps) instead of their sum. The suite is
              # sharded into its in-process half (-SkipBehavioralTests,
              # issue #132) and its pwsh-forking behavioral half, which is
              # itself split into two concurrent passes (-OnlyBehavioralTests
              # with -BehavioralSubshard/-BehavioralSubshardCount), so the
              # wall is max(shards) instead of their sum. The union of the
              # shards is exactly the full suite; coverage is unchanged.
              # Output is buffered until all four processes finish so the
              # logs do not interleave.
              shell: bash
              run: |
                  preflight_rc=0
                  pwsh -NoProfile -File scripts/preflight.ps1 -NoAutoFix -VerboseOutput >preflight.log 2>&1 &
                  preflight_pid=$!
                  core_rc=0
                  pwsh -NoProfile -File scripts/test-llm-harness.ps1 -SkipBehavioralTests -VerboseOutput >self-tests-core.log 2>&1 &
                  core_pid=$!
                  behavioral1_rc=0
                  pwsh -NoProfile -File scripts/test-llm-harness.ps1 -OnlyBehavioralTests -BehavioralSubshard 1 -BehavioralSubshardCount 2 -VerboseOutput >self-tests-behavioral-1.log 2>&1 &
                  behavioral1_pid=$!
                  behavioral2_rc=0
                  pwsh -NoProfile -File scripts/test-llm-harness.ps1 -OnlyBehavioralTests -BehavioralSubshard 2 -BehavioralSubshardCount 2 -VerboseOutput >self-tests-behavioral-2.log 2>&1 &
                  behavioral2_pid=$!
                  wait "$preflight_pid" || preflight_rc=$?
                  wait "$core_pid" || core_rc=$?
                  wait "$behavioral1_pid" || behavioral1_rc=$?
                  wait "$behavioral2_pid" || behavioral2_rc=$?
                  for log in preflight.log self-tests-core.log self-tests-behavioral-1.log self-tests-behavioral-2.log; do
                      printf '=== %s ===\n' "$log"
                      cat "$log" || true
                      rm -f "$log"
                  done
                  if [ "$preflight_rc" -ne 0 ] || [ "$core_rc" -ne 0 ] || [ "$behavioral1_rc" -ne 0 ] || [ "$behavioral2_rc" -ne 0 ]; then
                      printf '::error::self-tests job failed (preflight=%s core=%s behavioral-1=%s behavioral-2=%s)\n' "$preflight_rc" "$core_rc" "$behavioral1_rc" "$behavioral2_rc"
                      exit 1
                  fi
