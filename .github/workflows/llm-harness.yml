name: LLM Harness

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    validate:
        name: Validate LLM context
        runs-on: ubuntu-24.04
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              id: setup-python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"
                  cache: pip
                  cache-dependency-path: requirements-automation.txt

            - name: Install automation validation dependencies
              shell: bash
              run: |
                  python3 -m venv .venv-ci
                  . .venv-ci/bin/activate
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements-automation.txt

            - name: Preflight (parse-check toolkit sources)
              # MUST run before the main harness step. If any toolkit script
              # (lint-llm.ps1, install-git-hooks.ps1, etc.) is corrupted,
              # `run-llm-hooks.ps1` may not even be parseable. `-NoAutoFix`
              # keeps CI loud: a corrupted commit fails here rather than
              # being silently recovered.
              shell: pwsh
              run: pwsh -NoProfile -File scripts/preflight.ps1 -NoAutoFix -VerboseOutput

            - name: Run LLM harness (regenerate, lint)
              # Single source of truth shared with `.githooks/pre-commit`.
              # `-SkipStagedCheck` because CI validates committed content with
              # `git diff` below instead of participating in a local staging
              # flow. `-SkipSelfTests` hands the behavioral self-tests to the
              # parallel `self-tests` job so job wall clock is max(jobs)
              # instead of the sum (issue #84); coverage is unchanged.
              shell: pwsh
              run: pwsh -NoProfile -File scripts/run-llm-hooks.ps1 -Mode CI -SkipStagedCheck -NoAutoFix -VerboseOutput -PreflightAlreadyDone -SkipSelfTests

            - name: Verify generated files are committed
              # CI must additionally catch the case where a contributor forgot to
              # commit regenerated files. `git diff` after the harness ran will
              # show any drift introduced by regeneration.
              shell: pwsh
              run: |
                  git diff --exit-code -- .llm/index.md .llm/context.md
                  if ($LASTEXITCODE -ne 0) {
                    Write-Host '::error::Generated .llm files differ from committed versions. Run scripts/run-llm-hooks.ps1 and commit the result.'
                    exit 1
                  }

            - name: Fast hook performance guard
              shell: pwsh
              run: |
                  $runs = @()
                  for ($i = 0; $i -lt 3; $i++) {
                    $elapsed = Measure-Command {
                      pwsh -NoProfile -File scripts/run-llm-hooks.ps1 -Mode AgentFast -SkipStagedCheck -NoAutoFix | Out-Host
                    }
                    $runs += [int]$elapsed.TotalMilliseconds
                  }
                  $median = ($runs | Sort-Object)[1]
                  Write-Host "Fast hook runtimes (ms): $($runs -join ', '); median=$median"
                  if ($median -gt 5000) {
                    Write-Host "::error::Fast hook median runtime $median ms exceeds 5000 ms budget."
                    exit 1
                  }

    self-tests:
        name: LLM harness self-tests
        runs-on: ubuntu-24.04
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Preflight and behavioral self-tests
              # Same loud corruption gate as the validate job (issue #84
              # parallelism pattern): -NoAutoFix only parses tracked
              # sources, and the suite's destructive tests operate on temp
              # copies, so the two run concurrently and the job wall clock
              # is max(steps) instead of their sum. Both outcomes still
              # gate the job; coverage is unchanged.
              shell: bash
              run: |
                  preflight_rc=0
                  pwsh -NoProfile -File scripts/preflight.ps1 -NoAutoFix -VerboseOutput >preflight.log 2>&1 &
                  preflight_pid=$!
                  suite_rc=0
                  pwsh -NoProfile -File scripts/test-llm-harness.ps1 -VerboseOutput || suite_rc=$?
                  wait "$preflight_pid" || preflight_rc=$?
                  cat preflight.log || true
                  rm -f preflight.log
                  if [ "$suite_rc" -ne 0 ] || [ "$preflight_rc" -ne 0 ]; then
                      printf '::error::self-tests job failed (preflight=%s suite=%s)\n' "$preflight_rc" "$suite_rc"
                      exit 1
                  fi
