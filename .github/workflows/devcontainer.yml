name: Dev Container

on:
    pull_request:
        paths:
            - ".devcontainer/**"
            - ".github/workflows/devcontainer.yml"
            - "scripts/storage.py"
            - "scripts/test_storage*.py"
            - "scripts/check-webrtc-interop.py"
            - "scripts/check-webrtc-reference.py"
    push:
        branches: [main]
        paths:
            - ".devcontainer/**"
            - ".github/workflows/devcontainer.yml"
            - "scripts/storage.py"
            - "scripts/test_storage*.py"
            - "scripts/check-webrtc-interop.py"
            - "scripts/check-webrtc-reference.py"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    open:
        name: Open (${{ matrix.runner }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Test bootstrap and offline startup
              env:
                  SF_TEST_DOCKER: "1"
              run: |
                  python3 scripts/test_storage.py
                  python3 scripts/test_storage_host.py
                  python3 .devcontainer/test_portability.py
            - name: Build and open container
              id: open
              run: |
                  npx --yes @devcontainers/cli@0.89.0 up --workspace-folder . > "$RUNNER_TEMP/devcontainer-up.json"
                  node -e 'const fs = require("fs"); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (result.outcome !== "success" || !result.containerId) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT, `container_id=${result.containerId}\n`);' "$RUNNER_TEMP/devcontainer-up.json"
            - name: Verify installed tools and restart
              env:
                  CONTAINER_ID: ${{ steps.open.outputs.container_id }}
              run: |
                  docker stop "$CONTAINER_ID"
                  docker start "$CONTAINER_ID"
                  npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . \
                    python3 .devcontainer/install-agent-tools.py --verify
                  npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . \
                    python3 .devcontainer/verify-container-tools.py
                  npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . \
                    python3 .devcontainer/post-start.py

            - name: Measure image footprint
              if: always() && steps.open.outputs.container_id != ''
              env:
                  CONTAINER_ID: ${{ steps.open.outputs.container_id }}
              run: |
                  python3 .devcontainer/measure-storage.py "$CONTAINER_ID" > "$RUNNER_TEMP/storage-image.json"
            - name: Measure container and host storage
              if: always() && steps.open.outputs.container_id != ''
              run: |
                  npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . \
                    python3 scripts/storage.py --json report /tmp /home/vscode /vscode > "$RUNNER_TEMP/storage-container.json"
                  pwsh -NoProfile -File .devcontainer/storage-host.ps1 -AsJson > "$RUNNER_TEMP/storage-host.json"
            - name: Upload storage measurements
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: storage-${{ matrix.runner }}
                  path: ${{ runner.temp }}/storage-*.json
                  retention-days: 7
                  if-no-files-found: ignore
