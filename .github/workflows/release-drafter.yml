name: Release Draft

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    draft:
        name: Update release notes
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: read
        steps:
            - name: Update draft
              uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
              with:
                  commitish: main
                  publish: false
