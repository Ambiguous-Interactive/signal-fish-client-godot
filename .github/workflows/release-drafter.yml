name: Release Draft

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    draft:
        name: Update release notes
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: read
        steps:
            - name: Update draft
              uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
              with:
                  commitish: main
                  publish: false
