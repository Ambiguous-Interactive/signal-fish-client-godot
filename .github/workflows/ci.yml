name: Runtime CI

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            expected_sha:
                description: Commit expected on main
                required: false
                type: string

permissions:
    contents: read

# Superseded PR runs are canceled so pushed-through commits do not queue
# redundant runs; runs on main are never canceled (merge checks depend on them).
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify-dispatch:
        name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Check dispatched commit
              env:
                  EXPECTED_SHA: ${{ inputs.expected_sha }}
              run: python3 scripts/workflow-gates.py verify-sha

    source-format:
        name: Source formatting
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm

            - name: Install formatters
              run: |
                  npm ci --ignore-scripts
                  pwsh -NoProfile -Command 'Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AcceptLicense'
                  python3 scripts/install-source-tool.py shfmt "$RUNNER_TEMP/shfmt"
                  python3 scripts/install-source-tool.py shellcheck "$RUNNER_TEMP/shellcheck"

            - name: Check source formatting
              env:
                  SHFMT_BIN: ${{ runner.temp }}/shfmt
              run: python3 scripts/check-source.py format

            - name: Analyze source scripts
              env:
                  SHELLCHECK_BIN: ${{ runner.temp }}/shellcheck
              run: python3 scripts/check-source.py quality

    static:
        name: Static checks
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              id: setup-python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"
                  cache: pip
                  cache-dependency-path: requirements-ci.txt

            # The venv is rebuilt only when the pinned tooling or the resolved
            # Python version changes; otherwise restore and run directly.
            - name: Cache GDScript tooling venv
              id: venv-cache
              uses: actions/cache@v6
              with:
                  path: .venv-ci
                  key: venv-ci-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('scripts/install-ci-venv.py', 'requirements-ci.txt') }}

            - name: Install GDScript tooling
              if: steps.venv-cache.outputs.cache-hit != 'true'
              run: python3 scripts/install-ci-venv.py .venv-ci requirements-ci.txt

            - name: Check GDScript (helpers, format, lint)
              run: python3 -E scripts/run-runtime-checks.py gdscript-static

            - name: Check runtime fast-loop selection
              run: python3 scripts/run-runtime-checks.py --self-test

            - name: Asset Library archive allow-list
              run: |
                  python3 scripts/check-asset-archive.py --self-test
                  python3 scripts/check-asset-archive.py --repo-root .

            - name: Release preparation self-test
              run: python3 scripts/prepare-release.py --self-test
            - name: Test release workflow
              run: python3 scripts/release_workflow.py self-test

    python-types:
        name: Python types
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              id: setup-python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"
                  cache: pip
                  cache-dependency-path: |
                      requirements-ci.txt
                      requirements-python-quality.txt

            - name: Cache Python tooling venv
              id: venv-cache
              uses: actions/cache@v6
              with:
                  path: .venv-ci
                  key: venv-python-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('scripts/install-ci-venv.py', 'requirements-ci.txt', 'requirements-python-quality.txt') }}

            - name: Install Python tooling
              if: steps.venv-cache.outputs.cache-hit != 'true'
              run: python3 scripts/install-ci-venv.py .venv-ci requirements-python-quality.txt

            - name: Check Python types, format, and lint
              run: python3 -E scripts/run-runtime-checks.py python-types

            - name: Check Playwright system setup
              run: python3 -m unittest tests.test_install_playwright_deps

    test:
        name: Godot ${{ matrix.godot }} tests
        runs-on: ubuntu-24.04
        # The whole matrix historically finishes in ~1 minute; a hang (e.g. a
        # test runner crashing without quit()) must fail fast, not idle into
        # the 360-minute GitHub default.
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                godot: ["4.3-stable", "4.4.1-stable", "4.7.2-stable"]
        env:
            GODOT_VERSION: ${{ matrix.godot }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            # Headless Godot loads only fontconfig, freetype, and udev
            # (verified via /proc/<pid>/maps); the X11/GL/audio stack is never
            # loaded, so installing it only wastes CI minutes. Runner images
            # often already carry the three libraries, so skip apt entirely
            # when dpkg confirms they are present.
            - name: Install Godot runtime dependencies
              run: |
                  if ! dpkg -s libfontconfig1 libfreetype6 libudev1 >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends \
                      ca-certificates \
                      curl \
                      unzip \
                      libfontconfig1 \
                      libfreetype6 \
                      libudev1
                  fi

            - name: Cache Godot binary
              id: godot-cache
              uses: actions/cache@v6
              with:
                  path: /usr/local/bin/godot
                  key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}

            - name: Install Godot
              if: steps.godot-cache.outputs.cache-hit != 'true'
              run: sudo python3 .devcontainer/install-godot.py editor "${GODOT_VERSION}"

            - name: Verify Godot binary
              run: godot --headless --version

            - name: Run protocol fixture tests
              run: python3 -E scripts/run-runtime-checks.py godot
