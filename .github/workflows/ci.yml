name: Runtime CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

# Superseded PR runs are canceled so pushed-through commits do not queue
# redundant runs; runs on main are never canceled (merge checks depend on them).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    source-format:
        name: Source formatting
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Install formatters
              run: |
                  npm ci --ignore-scripts
                  pwsh -NoProfile -Command 'Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AcceptLicense'
                  bash scripts/install-shfmt.sh "$RUNNER_TEMP/shfmt"
                  bash scripts/install-shellcheck.sh "$RUNNER_TEMP/shellcheck"

            - name: Check source formatting
              env:
                  SHFMT_BIN: ${{ runner.temp }}/shfmt
              run: bash scripts/check-source-format.sh

            - name: Analyze source scripts
              env:
                  SHELLCHECK_BIN: ${{ runner.temp }}/shellcheck
              run: bash scripts/check-source-quality.sh

    static:
        name: Static checks
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              id: setup-python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"
                  cache: pip
                  cache-dependency-path: requirements-ci.txt

            # The venv is rebuilt only when the pinned tooling or the resolved
            # Python version changes; otherwise restore and run directly.
            - name: Cache GDScript tooling venv
              id: venv-cache
              uses: actions/cache@v6
              with:
                  path: .venv-ci
                  key: venv-ci-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements-ci.txt') }}

            - name: Install GDScript tooling
              if: steps.venv-cache.outputs.cache-hit != 'true'
              run: |
                  python3 -m pip install uv
                  python3 -m uv venv .venv-ci
                  python3 -m uv pip install --python .venv-ci/bin/python -r requirements-ci.txt

            - name: Check GDScript (helpers, format, lint)
              run: bash scripts/run-runtime-checks.sh gdscript-static

            - name: Asset Library archive allow-list
              run: |
                  python3 scripts/check-asset-archive.py --self-test
                  python3 scripts/check-asset-archive.py --repo-root .

    python-types:
        name: Python types
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              id: setup-python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"
                  cache: pip
                  cache-dependency-path: |
                      requirements-ci.txt
                      requirements-python-quality.txt

            - name: Cache Python tooling venv
              id: venv-cache
              uses: actions/cache@v6
              with:
                  path: .venv-ci
                  key: venv-python-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements-ci.txt', 'requirements-python-quality.txt') }}

            - name: Install Python tooling
              if: steps.venv-cache.outputs.cache-hit != 'true'
              run: |
                  python3 -m pip install uv
                  python3 -m uv venv .venv-ci
                  python3 -m uv pip install --python .venv-ci/bin/python -r requirements-python-quality.txt

            - name: Check Python types, format, and lint
              run: bash scripts/run-runtime-checks.sh python-types

    test:
        name: Godot ${{ matrix.godot }} tests
        runs-on: ubuntu-24.04
        # The whole matrix historically finishes in ~1 minute; a hang (e.g. a
        # test runner crashing without quit()) must fail fast, not idle into
        # the 360-minute GitHub default.
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                godot: ["4.3-stable", "4.4.1-stable", "4.7.2-stable"]
        env:
            GODOT_VERSION: ${{ matrix.godot }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            # Headless Godot loads only fontconfig, freetype, and udev
            # (verified via /proc/<pid>/maps); the X11/GL/audio stack is never
            # loaded, so installing it only wastes CI minutes. Runner images
            # often already carry the three libraries, so skip apt entirely
            # when dpkg confirms they are present.
            - name: Install Godot runtime dependencies
              run: |
                  if ! dpkg -s libfontconfig1 libfreetype6 libudev1 >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends \
                      ca-certificates \
                      curl \
                      unzip \
                      libfontconfig1 \
                      libfreetype6 \
                      libudev1
                  fi

            - name: Cache Godot binary
              id: godot-cache
              uses: actions/cache@v6
              with:
                  path: /usr/local/bin/godot
                  key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}

            - name: Install Godot
              if: steps.godot-cache.outputs.cache-hit != 'true'
              run: sudo bash .devcontainer/install-godot.sh "${GODOT_VERSION}"

            - name: Verify Godot binary
              run: godot --headless --version

            - name: Run protocol fixture tests
              run: bash scripts/run-runtime-checks.sh godot
