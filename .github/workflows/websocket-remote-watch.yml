name: WebSocket Remote Path

on:
    schedule:
        # Mondays 12:00 UTC: weekly #488 remote-path watch (upstream
        # godotengine/godot#125073), staggered after the macOS watch (11:00).
        # The defect run must keep failing with scoped loss at the payload
        # boundary; any change is upstream movement. Dispatch runs collect
        # extra path samples on demand. Note: GitHub disables schedule
        # triggers after ~60 days without repo activity; dispatch runs keep
        # it recoverable.
        - cron: "0 12 * * 1"
    workflow_dispatch:
        inputs:
            engine_version:
                description: Official Godot release to drive (Web export)
                required: true
                type: string
                default: 4.7.2-stable

permissions:
    contents: read

# Dispatched runs do the same check; the newer run wins.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

env:
    GODOT_VERSION: ${{ inputs.engine_version || '4.7.2-stable' }}
    GODOT_BIN: /tmp/godot-cache/godot
    CLOUDFLARED_VERSION: "2026.10.7"
    CLOUDFLARED_SHA256: 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
    REMOTE_PORT: "8990"

jobs:
    remote-watch:
        name: Watch the Web receive boundary over a remote path
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Godot runtime dependencies
              run: sudo python3 .devcontainer/install-godot.py runtime-deps

            - name: Cache Godot editor
              id: godot-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: /tmp/godot-cache
                  key: godot-remote-watch-editor-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}

            - name: Install Godot editor
              if: steps.godot-cache.outputs.cache-hit != 'true'
              run: python3 .devcontainer/install-godot.py editor "$GODOT_VERSION" /tmp/godot-cache --target "$GODOT_BIN"

            - name: Expose the Godot binary
              run: |
                  echo "$(dirname "$GODOT_BIN")" >> "$GITHUB_PATH"
                  "$GODOT_BIN" --headless --version

            - name: Cache web export templates
              id: templates-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.local/share/godot/export_templates
                  key: godot-remote-watch-templates-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}

            - name: Install web export templates
              if: steps.templates-cache.outputs.cache-hit != 'true'
              run: python3 .devcontainer/install-godot.py templates "$GODOT_VERSION" /tmp/godot-templates-cache "$HOME/.local/share/godot/export_templates"

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"

            - name: Install Python Playwright with uv
              run: python3 scripts/install-ci-venv.py .venv-remote-watch requirements-docs-accessibility.txt

            - name: Set up Playwright Chromium
              uses: ./.github/actions/playwright-chromium
              with:
                  python-path: .venv-remote-watch/bin/python

            # A credential-free Cloudflare quick tunnel fronts the fixture
            # server. The browser reaches it through the Cloudflare edge, so
            # every WebSocket frame crosses a real remote path with TLS.
            - name: Install cloudflared
              run: |
                  curl -sSfL -o /tmp/cloudflared \
                    "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
                  echo "$CLOUDFLARED_SHA256  /tmp/cloudflared" | sha256sum --check --
                  chmod +x /tmp/cloudflared
                  /tmp/cloudflared --version

            - name: Start the remote-path tunnel
              id: tunnel
              run: |
                  /tmp/cloudflared tunnel --no-autoupdate \
                    --url "http://127.0.0.1:${REMOTE_PORT}" > tunnel.log 2>&1 &
                  origin=""
                  for _ in $(seq 1 45); do
                      origin=$(grep -o "https://[a-z0-9-]*\.trycloudflare\.com" tunnel.log | head -1 || true)
                      [ -n "$origin" ] && break
                      sleep 2
                  done
                  if [ -z "$origin" ]; then
                      echo "trycloudflare tunnel did not come up:" >&2
                      cat tunnel.log >&2
                      exit 1
                  fi
                  echo "origin=$origin" >> "$GITHUB_OUTPUT"
                  # The fresh tunnel hostname can lag DNS. Wait for any HTTP
                  # answer from the edge; the fixture server starts later, so
                  # a 502 here still proves the remote path resolves.
                  code="000"
                  for _ in $(seq 1 20); do
                      code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$origin/index.html" || true)
                      if [ -n "$code" ] && [ "$code" != "000" ]; then
                          break
                      fi
                      sleep 3
                  done
                  echo "tunnel $origin reachable; edge answered HTTP ${code:-000}"

            - name: Reproduce the Web receive loss over the remote path
              id: defect
              run: |
                  rc=0
                  .venv-remote-watch/bin/python scripts/check-websocket-web-receive.py \
                    --godot "$GODOT_BIN" --output output/defect \
                    --port "$REMOTE_PORT" \
                    --public-origin "${{ steps.tunnel.outputs.origin }}" || rc=$?
                  echo "exit=$rc" >> "$GITHUB_OUTPUT"

            - name: Run the application ACK control over the remote path
              id: control
              run: |
                  rc=0
                  .venv-remote-watch/bin/python scripts/check-websocket-web-receive.py \
                    --godot "$GODOT_BIN" --output output/control \
                    --credit-transport app-ack --credit-bytes 32768 \
                    --port "$REMOTE_PORT" \
                    --public-origin "${{ steps.tunnel.outputs.origin }}" || rc=$?
                  echo "exit=$rc" >> "$GITHUB_OUTPUT"

            - name: Check remote-path expectations
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  defect = json.loads(Path("output/defect/assessment.json").read_text())
                  control = json.loads(Path("output/control/assessment.json").read_text())
                  defect_exit = "${{ steps.defect.outputs.exit }}"
                  control_exit = "${{ steps.control.outputs.exit }}"
                  origin = "${{ steps.tunnel.outputs.origin }}"
                  problems = []

                  # The application ACK control must deliver all 65 exact
                  # messages over the remote path: this is the remote-network
                  # qualification for the boundary (#488).
                  control_record = (
                      control["results"][0] if len(control.get("results", [])) == 1 else {}
                  )
                  if control_record.get("engine", "").startswith(os.environ["GODOT_VERSION"]):
                      pass
                  else:
                      problems.append(
                          f"remote control ran {control_record.get('engine')!r},"
                          f" expected {os.environ['GODOT_VERSION']!r} (wrong binary)"
                      )
                  if control_record.get("received") != list(range(65)):
                      problems.append(
                          f"remote control delivered {control_record.get('received')!r}"
                          " != all 65"
                      )
                  if control.get("receive_evidence", {}).get("reliable_delivery") is not True:
                      problems.append("remote control reliable_delivery unexpectedly false")
                  if (
                      control.get("application_acknowledged_packets") != 64
                      or control.get("application_sent_packets") != 65
                  ):
                      problems.append("remote control application ACK window incomplete")
                  if control.get("remote_origin") != origin:
                      problems.append("remote control did not record the tunnel origin")
                  if control_exit != "0":
                      problems.append(f"remote control exit {control_exit} != 0")

                  # The uncredited workload keeps failing at the payload
                  # boundary. The remote path must not mask it: a pass means
                  # upstream moved (requalify godotengine/godot#125073 and
                  # close #488). Four CI runs (two engines, four tunnels)
                  # each split the burst differently (first gaps 15->64,
                  # 15->46, 30->64): network segmentation changes which
                  # frames the engine accepts, so the gate pins the stable
                  # loss class - the three filed boundary failures, scoped
                  # rejections with a complete trace, and partial delivery
                  # below the full burst - instead of one exact pattern.
                  defect_records = defect.get("results", [])
                  if len(defect_records) != 1:
                      problems.append(
                          f"remote defect produced {len(defect_records)} result"
                          " records; expected exactly one"
                      )
                  defect_record = defect_records[0] if len(defect_records) == 1 else {}
                  evidence = defect.get("receive_evidence", {})
                  if defect_exit == "0":
                      problems.append(
                          "remote defect delivered everything (the upstream repair"
                          " landed: requalify it and close #488)"
                      )
                  elif defect_exit != "1":
                      problems.append(f"remote defect exit {defect_exit} unexpected")
                  if defect_record:
                      received = defect_record.get("received", [])
                      rejected = evidence.get("rejected_sequences", [])
                      if sorted(defect_record.get("failures", [])) != sorted(
                          ["finite burst count", "complete receive count", "exact receive prefix"]
                      ):
                          problems.append(
                              f"remote defect failures {defect_record.get('failures')!r}"
                              " unexpected"
                          )
                      # Sequences 0..64 arrive in order or the boundary moved:
                      # duplicates, reordering or out-of-range values are
                      # corrupt receipts the counts alone would miss.
                      if (
                          received != sorted(set(received))
                          or not all(0 <= value <= 64 for value in received)
                      ):
                          problems.append(
                              "remote defect delivered a duplicate, reordered or"
                              f" out-of-range sequence: {received!r}"
                          )
                      if not 0 < len(received) < 65 or not rejected:
                          problems.append(
                              "remote defect shows no scoped receive loss"
                              f" (delivered {len(received)},"
                              f" rejections {len(rejected)})"
                          )
                      drop_reasons = sorted(
                          {
                              row.get("reason")
                              for row in defect.get("receive_trace", {}).get(
                                  "rejections", []
                              )
                          }
                      )
                      if drop_reasons != ["payload_capacity"] and rejected:
                          problems.append(
                              "remote defect rejection reasons"
                              f" {drop_reasons!r} != payload_capacity only (a"
                              " packet-capacity drop is a different boundary)"
                          )
                      if evidence.get("trace_complete") is not True:
                          problems.append("remote defect receive trace incomplete")
                      if evidence.get("reliable_delivery") is not False:
                          problems.append("remote defect reliable_delivery unexpectedly true")
                      if evidence.get("unresolved_callback_sequences"):
                          problems.append(
                              "remote defect has unresolved browser callbacks:"
                              f" {evidence.get('unresolved_callback_sequences')!r}"
                          )

                  summary = [
                      "## WebSocket Remote Path",
                      "",
                      f"- Engine: {control_record.get('engine', 'unknown')} (Web export)",
                      f"- Browser: {control.get('browser', 'unknown')}",
                      f"- Remote path: {origin} (Cloudflare quick tunnel, TLS)",
                      f"- ACK control: {len(control_record.get('received', []))}/65"
                      " delivered over the remote path",
                      f"- Defect run: {len(defect_record.get('received', []))}/65"
                      " delivered,"
                      f" {len(evidence.get('rejected_sequences', []))} scoped rejections"
                      f" (first gap {defect_record.get('first_gap', {}).get('expected')}"
                      " ->"
                      f" {defect_record.get('first_gap', {}).get('received')})",
                      "",
                  ]
                  verdict = (
                      "Remote path green: the 32 KiB application ACK control qualifies"
                      " the boundary over a real remote path, and the uncredited loss"
                      " still reproduces"
                      " ([godotengine/godot#125073](https://github.com/godotengine/godot/issues/125073))."
                      if not problems
                      else "Remote path red: " + "; ".join(problems)
                  )
                  summary.extend(["", verdict, ""])
                  with open(
                      os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8"
                  ) as step_summary:
                      step_summary.write("\n".join(summary))
                  print(verdict)
                  assert not problems, "; ".join(problems)
                  PY

            - name: Stop the tunnel
              if: always()
              run: pkill -f "cloudflared tunnel" || true

            - name: Upload remote-path evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: websocket-remote-watch-${{ github.run_id }}
                  path: |
                      output/
                      tunnel.log
                  if-no-files-found: error

    # Follow-up 3 of #538: the paced native receive suites cross the same
    # tunnel, advancing the #485/#491/#492/#496/#498 remote-network items.
    # Controls must pass over the remote path; defect outcomes are
    # qualification data. A defect that passes means the path masked its
    # trigger or upstream moved, and the summary flags it for triage. Once
    # collected runs settle a stable signature, a later change pins it the
    # way the Web lane pins its loss class.
    remote-native-watch:
        name: Watch the paced native receive suites over a remote path
        runs-on: ubuntu-24.04
        # Covers the compound worst case: tunnel pre-check wait (~9 min) plus
        # every case at its fixture watchdog cap (~23 min) plus setup.
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        env:
            # Controls and filed defects for each receive issue class:
            # #491 fragmented assembly around control frames, #492 peer reuse
            # retention, #496 full-buffer empty-fragment stall and #498
            # Unicode close reasons across reads.
            NATIVE_CASES: >-
                read-control-none
                read-control-ping
                read-control-pong
                chunk-reuse-text-text-handshake
                chunk-reuse-text-text-closing
                chunk-limit-binary-none-false
                close-3-ascii-server
                close-3-mixed-server
                boundary-close-3-max-ascii-server-false
                boundary-close-3-max-mixed-server-false
            NATIVE_CONTROL_CASES: >-
                read-control-none
                chunk-reuse-text-text-handshake
                close-3-ascii-server
                boundary-close-3-max-ascii-server-false
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Godot runtime dependencies
              run: sudo python3 .devcontainer/install-godot.py runtime-deps

            - name: Cache Godot editor
              id: godot-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: /tmp/godot-cache
                  key: godot-remote-native-editor-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}

            - name: Install Godot editor
              if: steps.godot-cache.outputs.cache-hit != 'true'
              run: python3 .devcontainer/install-godot.py editor "$GODOT_VERSION" /tmp/godot-cache --target "$GODOT_BIN"

            - name: Expose the Godot binary
              run: |
                  echo "$(dirname "$GODOT_BIN")" >> "$GITHUB_PATH"
                  "$GODOT_BIN" --headless --version

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"

            - name: Install cloudflared
              run: |
                  curl -sSfL -o /tmp/cloudflared \
                    "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
                  echo "$CLOUDFLARED_SHA256  /tmp/cloudflared" | sha256sum --check --
                  chmod +x /tmp/cloudflared
                  /tmp/cloudflared --version

            - name: Start the remote-path tunnel
              id: tunnel
              run: |
                  /tmp/cloudflared tunnel --no-autoupdate \
                    --url "http://127.0.0.1:${REMOTE_PORT}" > tunnel.log 2>&1 &
                  origin=""
                  for _ in $(seq 1 45); do
                      origin=$(grep -o "https://[a-z0-9-]*\.trycloudflare\.com" tunnel.log | head -1 || true)
                      [ -n "$origin" ] && break
                      sleep 2
                  done
                  if [ -z "$origin" ]; then
                      echo "trycloudflare tunnel did not come up:" >&2
                      cat tunnel.log >&2
                      exit 1
                  fi
                  echo "origin=$origin" >> "$GITHUB_OUTPUT"
                  code="000"
                  for _ in $(seq 1 20); do
                      code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$origin/index.html" || true)
                      if [ -n "$code" ] && [ "$code" != "000" ]; then
                          break
                      fi
                      sleep 3
                  done
                  echo "tunnel $origin reachable; edge answered HTTP ${code:-000}"

            - name: Run the paced native receive suites over the remote path
              id: native
              run: |
                  case_args=()
                  for case_name in $NATIVE_CASES; do
                      case_args+=(--case "$case_name")
                  done
                  rc=0
                  python3 scripts/check-websocket-native-receive.py \
                    --godot "$GODOT_BIN" --importer "$GODOT_BIN" \
                    --output output/native \
                    --port "$REMOTE_PORT" \
                    --public-origin "${{ steps.tunnel.outputs.origin }}" \
                    "${case_args[@]}" || rc=$?
                  echo "exit=$rc" >> "$GITHUB_OUTPUT"

            - name: Check remote-path expectations
              env:
                  TUNNEL_ORIGIN: ${{ steps.tunnel.outputs.origin }}
                  NATIVE_EXIT: ${{ steps.native.outputs.exit }}
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  role_control = set(os.environ["NATIVE_CONTROL_CASES"].split())
                  filed_failure = {
                      "read-control-ping": "exact receive prefix",
                      "read-control-pong": "exact receive prefix",
                      "chunk-limit-binary-none-false": "complete message missing",
                      "chunk-reuse-text-text-closing": "fresh exact bytes",
                      "close-3-mixed-server": "exact close code, reason and empty packet queue",
                      "boundary-close-3-max-mixed-server-false": (
                          "exact close code, reason and empty packet queue"
                      ),
                  }
                  role_defect = set(filed_failure)
                  origin = os.environ["TUNNEL_ORIGIN"]
                  version = os.environ["GODOT_VERSION"]
                  summary = json.loads(Path("output/native/summary.json").read_text())
                  provenance = json.loads(Path("output/native/provenance.json").read_text())
                  problems = []

                  imported = summary.get("import", {})
                  if imported.get("returncode") != 0 or imported.get("engine_errors"):
                      problems.append("fixture import failed")

                  if provenance.get("public_origin") != origin:
                      problems.append(
                          f"provenance origin {provenance.get('public_origin')!r}"
                          f" != tunnel origin {origin!r}"
                      )
                  if provenance.get("port") != int(os.environ["REMOTE_PORT"]):
                      problems.append(
                          f"provenance port {provenance.get('port')!r} !="
                          f" {os.environ['REMOTE_PORT']!r}"
                      )

                  cases = {case["case"]: case for case in summary.get("cases", [])}
                  unexpected = sorted(set(cases) - (role_control | role_defect))
                  missing = sorted((role_control | role_defect) - set(cases))
                  if unexpected:
                      problems.append(f"unexpected cases ran: {unexpected}")
                  if missing:
                      problems.append(f"cases produced no report: {missing}")

                  # Controls qualify the path: without them a defect record
                  # proves nothing about the remote network. The driver-level
                  # passed verdict covers the engine error scan, pacing and
                  # receive observations, so it is authoritative here.
                  for name in sorted(role_control):
                      case = cases.get(name, {})
                      record = case.get("result") or {}
                      if case.get("passed") is not True:
                          detail = record.get("failures") or (
                              "timed out" if case.get("timed_out") else "no failures recorded"
                          )
                          problems.append(f"remote control {name} failed: {detail!r}")
                      if record.get("engine", "").startswith(version) is not True:
                          problems.append(
                              f"remote control {name} ran {record.get('engine')!r},"
                              f" expected {version!r} (wrong binary)"
                          )
                      if record.get("remote_origin") != origin:
                          problems.append(
                              f"remote control {name} did not record the tunnel origin"
                          )

                  # Defect outcomes are the qualification data. Structure is
                  # gated (a complete paced record with a clean exit); the
                  # outcome itself is data. A defect that passes at the driver
                  # level means the path masked its trigger or upstream moved;
                  # a fail without the filed signature is a new remote-path
                  # behavior. Both stay green during the data-collection phase
                  # and are flagged for triage in the summary.
                  passed_defects = []
                  novel_defects = []
                  for name in sorted(role_defect):
                      case = cases.get(name, {})
                      record = case.get("result") or {}
                      if case.get("timed_out") or not record:
                          problems.append(f"remote defect {name} produced no result record")
                          continue
                      if case.get("returncode") not in (0, 1):
                          problems.append(
                              f"remote defect {name} exited"
                              f" {case.get('returncode')!r} (crash invalidates the sample)"
                          )
                          continue
                      if record.get("remote_origin") != origin:
                          problems.append(
                              f"remote defect {name} did not record the tunnel origin"
                          )
                      wire = record.get("wire", {})
                      # Mirror the driver's pacing floor: close-kind cases
                      # need one paced write, the others two.
                      minimum_writes = (
                          1
                          if name.startswith(("close-", "boundary-close-"))
                          else 2
                      )
                      if wire.get("writes", 0) < minimum_writes:
                          problems.append(
                              f"remote defect {name} shows no paced writes: {wire!r}"
                          )
                      if case.get("passed") is True:
                          passed_defects.append(name)
                      elif filed_failure[name] not in record.get("failures", []):
                          novel_defects.append(name)

                  exit_code = os.environ["NATIVE_EXIT"]
                  if exit_code not in ("0", "1"):
                      problems.append(f"suite exit {exit_code} unexpected (crash or abort)")

                  rows = []
                  for name in sorted(role_control | role_defect):
                      case = cases.get(name, {})
                      record = case.get("result") or {}
                      outcome = (
                          "pass"
                          if record.get("passed") is True
                          else "fail"
                          if record.get("passed") is False
                          else "no record"
                      )
                      failures = "; ".join(record.get("failures", [])) or "-"
                      rows.append(
                          f"| {name} |"
                          f" {'control' if name in role_control else 'defect'}"
                          f" | {outcome} | {failures} |"
                      )
                  summary_lines = [
                      "## Paced native receive suites over a remote path",
                      "",
                      f"- Engine: official {version} (ubuntu-24.04 x86-64, editor binary)",
                      f"- Remote path: {origin} (Cloudflare quick tunnel, TLS)",
                      f"- Suite exit: {exit_code} (1 is expected: defect cases fail on"
                      " official engines)",
                      "",
                      "| Case | Role | Outcome | Failures |",
                      "| --- | --- | --- | --- |",
                      *rows,
                      "",
                  ]
                  if passed_defects:
                      summary_lines.extend(
                          [
                              "Defect cases that passed over the remote path:"
                              f" {', '.join(passed_defects)}. The path masked the"
                              " trigger or upstream moved; triage the run"
                              " (collect more samples before pinning).",
                              "",
                          ]
                      )
                  if novel_defects:
                      summary_lines.extend(
                          [
                              "Defect cases that failed without their filed signature:"
                              f" {', '.join(novel_defects)}. New remote-path behavior;"
                              " read the run's per-case logs before pinning.",
                              "",
                          ]
                      )
                  verdict = (
                      "Remote path green: every control qualifies its suite over a real"
                      " remote path and every defect keeps a complete paced record."
                      if not problems
                      else "Remote path red: " + "; ".join(problems)
                  )
                  summary_lines.extend(["", verdict, ""])
                  with open(
                      os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8"
                  ) as step_summary:
                      step_summary.write("\n".join(summary_lines))
                  print(verdict)
                  assert not problems, "; ".join(problems)
                  PY

            - name: Stop the tunnel
              if: always()
              run: pkill -f "cloudflared tunnel" || true

            - name: Upload remote-path evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: websocket-remote-native-${{ github.run_id }}
                  path: |
                      output/
                      tunnel.log
                  if-no-files-found: error
