name: Web Export Smoke

# Kept off the fast gate (pull_request/push): template downloads make this
# job minutes long, while the fast gate stays seconds. A weekly run plus
# on-demand dispatch catches export breakage without slowing every PR.
on:
    schedule:
        # Mondays 07:00 UTC, after Protocol Sync. GitHub disables schedule
        # triggers after ~60 days without repo activity; dispatch runs keep
        # it recoverable.
        - cron: "0 7 * * 1"
    workflow_dispatch:

permissions:
    contents: read

# Scheduled and dispatched runs export the same tree; superseded runs are
# redundant template downloads.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    web-export:
        name: Export demo to web
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install Godot with export templates
              uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
              with:
                  version: 4.3.0-stable
                  include-templates: true
                  use-dotnet: false

            - name: Prepare web export and smoke certificate
              run: python3 scripts/prepare-web-export.py

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Install Python Playwright with uv
              run: python3 scripts/install-ci-venv.py .venv-web-smoke requirements-docs-accessibility.txt

            - name: Set up Playwright Chromium
              uses: ./.github/actions/playwright-chromium
              with:
                  python-path: .venv-web-smoke/bin/python

            - name: Browser retry tests
              run: .venv-web-smoke/bin/python -m unittest discover -s tests -p test_web_export_browser_retry.py

            - name: Browser-export checklist
              env:
                  DEBUG: pw:browser
              run: |
                  .venv-web-smoke/bin/python scripts/check-web-export-browser.py \
                      --web-root build/web \
                      --key build/smoke-certs/key.pem \
                      --cert build/smoke-certs/cert.pem

            # Same SHA-pinned v7.0.1 as docs-validation.yml (issue #140): the
            # mutable @v4 tag had already drifted three majors behind the
            # rest of the artifact pipeline.
            - name: Upload web build
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: web-export
                  path: build/web
