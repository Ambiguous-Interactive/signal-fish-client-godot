name: WebSocket Native x64

on:
    workflow_dispatch:
        inputs:
            engine_revision:
                description: Pinned Godot source revision to build
                required: true
                type: string
                default: ed1daf0bf001b61586d9930840f2f1394092c079
            engine_label:
                description: Official editor release tag used for fixture import
                required: true
                type: string
                default: 4.7.2-stable
            recv_cap_bytes:
                description: Per-read byte cap for paced receives (0 disables)
                required: true
                type: number
                default: 3
            run_baseline:
                description: Also build the unpatched baseline and run its reproductions
                required: true
                type: boolean
                default: true

permissions:
    contents: read

jobs:
    qualify:
        name: ${{ matrix.variant }} ${{ inputs.engine_label }} on x86-64
        runs-on: ubuntu-24.04
        timeout-minutes: 75
        strategy:
            fail-fast: false
            matrix:
                variant: [repaired, baseline]
        if: matrix.variant != 'baseline' || inputs.run_baseline
        env:
            GODOT_REVISION: ${{ inputs.engine_revision }}
            GODOT_LABEL: ${{ inputs.engine_label }}
            RECV_CAP: ${{ inputs.recv_cap_bytes }}
            SOURCE_DIR: godot-source
            ENGINE_BIN: godot-source/bin/godot.linuxbsd.template_debug.x86_64
            IMPORTER: ${{ github.workspace }}/official-godot/godot
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"

            - name: Install SCons
              run: python3 -m pip install "scons==4.11.1"

            - name: Install Godot runtime dependencies
              run: sudo python3 .devcontainer/install-godot.py runtime-deps

            - name: Install official importer
              run: |
                  python3 .devcontainer/install-godot.py editor "$GODOT_LABEL" \
                    /tmp/godot-cache --target "$IMPORTER"
                  "$IMPORTER" --headless --version

            - name: Prepare evidence directory
              run: mkdir -p output

            - name: Fetch pinned engine source
              run: |
                  git init "$SOURCE_DIR"
                  git -C "$SOURCE_DIR" remote add origin https://github.com/godotengine/godot.git
                  git -C "$SOURCE_DIR" fetch --depth 1 origin "$GODOT_REVISION"
                  git -C "$SOURCE_DIR" checkout --detach FETCH_HEAD
                  test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$GODOT_REVISION"

            - name: Apply the receive repair patch
              if: matrix.variant == 'repaired'
              run: |
                  python3 scripts/repair-websocket-stable.py --source "$SOURCE_DIR" \
                    --report "output/repair-report.json"

            - name: Build the engine
              run: |
                  scons -j"$(nproc)" platform=linuxbsd target=template_debug arch=x86_64 \
                    dev_build=no debug_symbols=no optimize=size \
                    modules_enabled_by_default=no module_gdscript_enabled=yes \
                    module_websocket_enabled=yes module_webrtc_enabled=yes \
                    disable_3d=yes vulkan=no opengl3=yes x11=no wayland=no \
                    alsa=no pulseaudio=no dbus=no speechd=no fontconfig=no udev=no \
                    disable_path_overrides=no \
                    2>&1 | tee "output/build-${{ matrix.variant }}.log"
                  sha256sum "$ENGINE_BIN" | tee "output/engine-sha256.txt"

            - name: Run the paced receive suite
              if: matrix.variant == 'repaired'
              run: |
                  cap_args=()
                  if [ "$RECV_CAP" != "0" ]; then
                    cap_args=(--recv-cap-bytes="$RECV_CAP")
                  fi
                  python3 scripts/check-websocket-native-receive.py \
                    --godot "$ENGINE_BIN" --importer "$IMPORTER" \
                    "${cap_args[@]}" \
                    --output "output/repaired-suite"

            - name: Run the standalone reproductions
              run: |
                  python3 scripts/check-websocket-native-receive.py \
                    --godot "$ENGINE_BIN" --importer "$IMPORTER" \
                    --run-repro --output "output/${{ matrix.variant }}-standalone"

            - name: Check qualification expectations
              run: |
                  python3 - <<'PY'
                  import json
                  from pathlib import Path

                  variant = "${{ matrix.variant }}"
                  report = json.loads(
                      Path("output/${{ matrix.variant }}-standalone/standalone-report.json").read_text()
                  )
                  passed = {command["name"]: command["passed"] for command in report["commands"]}
                  defect = {"control-bytes", "reuse", "full-buffer", "close-unicode"}
                  control = {"control-baseline", "reuse-baseline", "close-baseline"}
                  missing = (defect | control) - set(passed)
                  assert not missing, f"missing commands: {sorted(missing)}"
                  if variant == "repaired":
                      wrong = sorted(name for name, ok in passed.items() if not ok)
                  else:
                      wrong = sorted(
                          [name for name in defect if passed[name]]
                          + [name for name in control if not passed[name]]
                      )
                  assert not wrong, f"unexpected results: {wrong}"
                  print(f"{variant}: all standalone expectations met on x86-64")
                  PY

            - name: Upload qualification evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: websocket-native-x64-${{ matrix.variant }}-${{ github.run_id }}
                  path: |
                      output/
                      !output/**/*.so
                  if-no-files-found: error
