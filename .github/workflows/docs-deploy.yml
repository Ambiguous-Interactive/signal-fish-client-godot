name: Docs Deploy

# Issue #123: Docs Validation builds the site once on main and uploads it;
# deploys publish that artifact instead of building a third copy. A push to
# main deploys after validation. Dependabot merges dispatch this workflow
# with a validated run ID because their token-dispatched validation does not
# produce a downstream workflow_run event. A manual dispatch builds source.
on:
    workflow_run:
        workflows:
            - Docs Validation
        types:
            - completed
    workflow_dispatch:
        inputs:
            expected_sha:
                description: Commit expected on main
                required: false
                type: string
            validated_run_id:
                description: Successful Docs Validation run to deploy
                required: false
                type: string

permissions:
    contents: read
    actions: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: Build Documentation
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_branch == 'main'
            )
        # The event guard matters: a fork PR whose branch is named
        # `main` would otherwise pass the head_branch check, start this job,
        # and fail the artifact download it can never have (Bugbot, PR #130).
        # Least privilege: only `deploy` consumes the workflow-level pages/id-token
        # write grants. The build job handles third-party docs artifacts, so it
        # must not hold an OIDC-minting handle; `pages: read` covers the
        # configure-pages metadata GET (actions/configure-pages#188) and
        # `actions: read` the cross-run artifact download.
        permissions:
            contents: read
            pages: read
            actions: read
        steps:
            - name: Check out repository
              if: github.event_name == 'workflow_dispatch' && inputs.validated_run_id == ''
              uses: actions/checkout@v7

            - name: Set up Python
              if: github.event_name == 'workflow_dispatch' && inputs.validated_run_id == ''
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Install MkDocs dependencies with uv
              if: github.event_name == 'workflow_dispatch' && inputs.validated_run_id == ''
              env:
                  PIP_DEFAULT_TIMEOUT: "60"
                  UV_HTTP_TIMEOUT: "60"
                  UV_HTTP_RETRIES: "5"
              run: |
                  python3 -m pip install uv
                  python3 -m uv venv .venv-docs
                  python3 -m uv pip install --python .venv-docs/bin/python -r requirements-docs.txt

            - name: Build MkDocs site
              if: github.event_name == 'workflow_dispatch' && inputs.validated_run_id == ''
              run: |
                  .venv-docs/bin/mkdocs build --strict
                  test -f site/llms.txt

            - name: Wait for validated site
              if: github.event_name == 'workflow_dispatch' && inputs.validated_run_id != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
                  EXPECTED_SHA: ${{ inputs.expected_sha }}
              run: |
                  if [[ ! "$VALIDATED_RUN_ID" =~ ^[0-9]+$ ]] || [ -z "$EXPECTED_SHA" ] || [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
                      echo '::error::Invalid validated run ID or commit SHA.'
                      exit 1
                  fi
                  validated=0
                  for ((attempt = 0; attempt < 150; attempt++)); do
                      if ! run_json=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN_ID"); then
                          sleep 10
                          continue
                      fi
                      if ! jq -e --arg sha "$EXPECTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
                          .repository.full_name == $repo and
                          .path == ".github/workflows/docs-validation.yml" and
                          .event == "workflow_dispatch" and
                          .head_branch == "main" and
                          .head_sha == $sha
                      ' <<< "$run_json" > /dev/null; then
                          echo '::error::The selected run is not main Docs Validation for this commit.'
                          exit 1
                      fi
                      status=$(jq -r '.status' <<< "$run_json")
                      if [ "$status" = completed ]; then
                          if [ "$(jq -r '.conclusion' <<< "$run_json")" != success ]; then
                              echo '::error::Docs Validation did not succeed.'
                              exit 1
                          fi
                          validated=1
                          break
                      fi
                      sleep 10
                  done
                  if [ "$validated" -ne 1 ]; then
                      echo '::error::Timed out waiting for Docs Validation.'
                      exit 1
                  fi

            - name: Download validated site
              if: github.event_name == 'workflow_run' || inputs.validated_run_id != ''
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: docs-site
                  path: site/
                  run-id: ${{ github.event.workflow_run.id || inputs.validated_run_id }}
                  github-token: ${{ github.token }}
            # A validation run that started before the artifact handoff shipped
            # completes without a docs-site artifact; this step then fails
            # loudly and the next validation run self-heals the deploy.

            - name: Set up Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: site/

    deploy:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
