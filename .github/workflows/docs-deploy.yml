name: Docs Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: Build Documentation
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # Least privilege: only `deploy` consumes the workflow-level pages/id-token
        # write grants. The build job installs third-party docs dependencies, so it
        # must not hold an OIDC-minting handle; `pages: read` covers the
        # configure-pages metadata GET (actions/configure-pages#188).
        permissions:
            contents: read
            pages: read
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python (with pip cache)
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements-docs.txt

            - name: Install MkDocs dependencies
              run: pip install -r requirements-docs.txt

            - name: Build MkDocs site
              run: mkdocs build --strict

            - name: Verify the canonical llms.txt is published
              run: test -f site/llms.txt

            - name: Set up Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: site/

    deploy:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
