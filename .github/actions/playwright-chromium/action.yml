name: Set up Playwright Chromium
description: >-
  Cached pinned Playwright + Chromium with the shared system-deps stamp
  contract. The default input sets the browser version for both workflows
  (issue #137).
inputs:
  python-path:
    description: Python interpreter with the pinned Playwright package installed
    required: true
  playwright-version:
    description: Pinned playwright package version
    required: false
    default: "1.63.0"
runs:
  using: composite
  steps:
    - name: Record runner image version
      shell: bash
      run: python3 scripts/install_playwright_deps.py record-image-version

    - name: Cache Playwright Chromium
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/ms-playwright
        # v4: the entry carries only the browser and system-deps stamp. The key
        # includes the runner image version so an image refresh cannot
        # pair a stale stamp with changed libraries.
        key: playwright-chromium-v4-${{ runner.os }}-${{ runner.arch }}-${{ env.IMAGE_VERSION }}-${{ inputs.playwright-version }}

    - name: Install pinned Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PLAYWRIGHT_PYTHON: ${{ inputs.python-path }}
      run: '"$PLAYWRIGHT_PYTHON" -m playwright install chromium'

    - name: Install Chromium system dependencies
      shell: bash
      env:
        PLAYWRIGHT_PYTHON: ${{ inputs.python-path }}
        PLAYWRIGHT_VERSION: ${{ inputs.playwright-version }}
      run: >-
        python3 scripts/install_playwright_deps.py install
        --python "$PLAYWRIGHT_PYTHON"
        --playwright-version "$PLAYWRIGHT_VERSION"
