name: Set up Playwright Chromium
description: >-
  Cached pinned Playwright + Chromium with the shared system-deps stamp
  contract. The default input sets the browser version for both workflows
  (issue #137).
inputs:
  python-path:
    description: Python interpreter with the pinned Playwright package installed
    required: true
  playwright-version:
    description: Pinned playwright package version
    required: false
    default: "1.63.0"
runs:
  using: composite
  steps:
    - name: Record runner image version
      shell: bash
      run: echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

    - name: Cache Playwright Chromium
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/ms-playwright
        # v4: the entry carries only the browser and system-deps stamp. The key
        # includes the runner image version so an image refresh cannot
        # pair a stale stamp with changed libraries.
        key: playwright-chromium-v4-${{ runner.os }}-${{ runner.arch }}-${{ env.IMAGE_VERSION }}-${{ inputs.playwright-version }}

    - name: Install pinned Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PLAYWRIGHT_PYTHON: ${{ inputs.python-path }}
      run: '"$PLAYWRIGHT_PYTHON" -m playwright install chromium'

    # System libraries are needed on every fresh runner even when the
    # browser cache hits, but apt-get update (which Playwright's
    # installer runs internally, and where the runner image's
    # third-party Google Chrome repo can be mid-publish) is the slowest
    # step of the consumer jobs. A stamp file inside the cached browser
    # directory records a completed install for this runner image +
    # Playwright pair (the cache key also carries both), so warm runs
    # skip the Playwright probe and the apt cycle entirely. On any miss,
    # ask Playwright for its own package list and skip apt entirely when
    # dpkg already satisfies it; any parse surprise falls back to the
    # original install path.
    - name: Install Chromium system dependencies
      shell: bash
      env:
        PLAYWRIGHT_PYTHON: ${{ inputs.python-path }}
      run: |
        stamp="${HOME}/.cache/ms-playwright/.sf-system-deps"
        mkdir -p "$(dirname "$stamp")"
        # Without a real image version (self-hosted runners) the
        # stamp could pin stale state across image updates, so it
        # is neither trusted nor written there.
        if [ "${IMAGE_VERSION}" != "unknown" ] && [ -f "$stamp" ] \
            && [ "$(cat "$stamp")" = "${IMAGE_VERSION} ${{ inputs.playwright-version }}" ]; then
            echo "chromium system dependencies already installed (stamp)"
            exit 0
        fi
        probe=$("$PLAYWRIGHT_PYTHON" -m playwright install-deps --dry-run chromium 2>/dev/null) || probe=""
        pkgs=$(printf '%s\n' "$probe" \
            | tr ' \\\t' '\n\n\n' \
            | grep -E '^[a-z0-9][a-z0-9+.~-]*$' \
            | grep -vE '^(sudo|apt|apt-get|install|update|cd)$' \
            | sort -u) || true
        missing=1
        if [ "$probe" = "All system dependencies are installed." ]; then
            missing=0
        elif [ -n "$pkgs" ]; then
            missing=0
            for pkg in $pkgs; do
                # Exact status (not `dpkg -s`, which succeeds for
                # removed-but-rc packages whose files are gone).
                # The `|| status=` guard matters: GitHub runs this
                # as `bash -e`, and dpkg-query exits 1 for any
                # package absent from the dpkg database, the
                # normal case on a fresh runner - which must fall
                # through to the install path, not abort the step.
                status=$(dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null) || status=""
                if [ "$status" != "installed" ]; then
                    missing=1
                    break
                fi
            done
        fi
        if [ "$missing" -eq 0 ]; then
            echo "chromium system dependencies already present"
            if [ "${IMAGE_VERSION}" != "unknown" ]; then
                printf '%s %s\n' "${IMAGE_VERSION}" "${{ inputs.playwright-version }}" > "$stamp"
            fi
            exit 0
        fi
        sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
        for attempt in 1 2 3; do
            if "$PLAYWRIGHT_PYTHON" -m playwright install-deps chromium; then
                if [ "${IMAGE_VERSION}" != "unknown" ]; then
                    printf '%s %s\n' "${IMAGE_VERSION}" "${{ inputs.playwright-version }}" > "$stamp"
                fi
                break
            fi
            if [ "${attempt}" -eq 3 ]; then
                printf 'playwright install-deps failed after %d attempts\n' "${attempt}" >&2
                exit 1
            fi
            printf 'playwright install-deps attempt %d failed; retrying\n' "${attempt}" >&2
            sleep 20
        done
