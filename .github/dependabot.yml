version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:20"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      python-ci-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-ci-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:40"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(devcontainer)"
      include: "scope"
    cooldown:
      default-days: 3
    # Do not add `groups` or `multi-ecosystem-group` here. The devcontainers
    # updater has been fragile with grouped updates; keep feature updates
    # ungrouped so scans keep producing PRs reliably.

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      devcontainer-image:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      devcontainer-image-security:
        applies-to: "security-updates"
        patterns:
          - "*"
